[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masharikiweather"
version = "0.1.9"
description = "A geostatistical extraction and alignment engine for African weather and satellite data."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name="Teofilo Ligawa" },
  { name="Samuel Mbugua" },
  { name="James Muiru" },
  { name="Hilda Muthoni" },
  { name="Ciira wa Maina" },
]
maintainers = [
  { name="DSAIL, Dedan Kimathi University of Technology" },
]

# Tell the build system to read dependencies dynamically
dynamic = ["dependencies"]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "torch-geometric>=2.5.0",
    "torchvision"
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=3.0.0"
]
arco = [
    "obstore>=0.10.0"
]

# Point setuptools strictly to your requirements file
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["masharikiweather*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
